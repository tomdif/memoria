[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memoria"
version = "0.3.0"
description = "Spectral memory architecture with CAG-informed retrieval and consolidation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "rank-bm25>=0.2.2",
    "scipy>=1.10",
    "sentence-transformers>=2.2",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0"]
llm = ["anthropic>=0.39"]
bench = ["chromadb>=0.5"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.9"]

[project.scripts]
memoria = "memoria.cli:main"

[project.urls]
Repository = "https://github.com/tomdif/memoria"
Issues = "https://github.com/tomdif/memoria/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
